{% from 'shared/charts/_axis_checkboxes.html' import render_axis_checkboxes %}

<div class="chart-container">
  {{ chart.to_html()|safe }}

  <div class="data-controls">
    <div class="column left">
      <span class="icon icon-left"></span>
      <label>
        <input
            type="checkbox"
            class="js-log js-log-left"
            name="log-left"
            {{ "checked" if chart_form.log_left }} />
        <span>Log view</span>
      </label>
    </div>

    <div class="column right">
      <label>
        <input
            type="checkbox"
            class="js-log js-log-right"
            name="log-right"
            {{ "checked" if chart_form.log_right }} />
        <span>Log view</span>
      </label>
      <span class="icon icon-right"></span>
    </div>
  </div>

  <div class="traces-list js-contexts-list">
    {{ render_axis_checkboxes(chart_form) }}
  </div>

  <br>

  <div class="flex-row margin-top-10">
    <a
        href="{{ url_for('study_visualize_page', publicId=study.publicId) }}?{{ chart_form.permalink_query }}"
        class="js-permalink">
      Link to this page
    </a>

    <a href="#" class="green-button flex-right js-compare">
      Compare across studies
    </a>
  </div>
</div>
